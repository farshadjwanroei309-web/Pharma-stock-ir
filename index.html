<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه انبارداری پیشرفته دارو و کالاپزشکی</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.15), 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        }
        .neon-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .neon-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .neon-reg-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- کانتینر اصلی اپلیکیشن -->
    <div id="app" class="w-full max-w-md glass-card rounded-3xl p-6 relative">
        
        <!-- هدر برنامه -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-sky-500/10 text-sky-400 rounded-2xl mb-3 border border-sky-500/30 shadow-[0_0_15px_rgba(56,189,248,0.2)] text-3xl">
                💊
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide">سامانه انبارداری پیشرفته</h1>
            <p class="text-xs text-sky-300/70 mt-1">مدیریت هوشمند دارو و تجهیزات پزشکی</p>
        </div>

        <!-- فرم ورود (Login View) -->
        <div id="login-view" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">شماره موبایل یا آیدی کاربری:</label>
                <input type="text" id="login-user" placeholder="مثال: 09123456789 یا farshad_admin" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
            </div>

            <!-- فیلد رمز عبور با دکمه چشم باز و بسته -->
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">رمز عبور:</label>
                <div class="relative">
                    <input type="password" id="login-pass" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
                    <button type="button" onclick="togglePassword('login-pass', this)" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-sky-400 text-base focus:outline-none transition">
                        👁️
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <a href="#" onclick="switchView('register-view')" class="text-sky-400 hover:text-sky-300 transition font-medium">ثبت‌نام داروخانه / کالاپزشکی</a>
                <a href="#" class="hover:text-slate-300 transition">فراموشی رمز عبور؟</a>
            </div>

            <button onclick="handleLogin()" class="w-full neon-btn text-white font-medium py-3 rounded-xl transition mt-2">
                ورود به سیستم
            </button>
        </div>

        <!-- فرم ثبت‌نام مدیر کل (Register View - مخفی به صورت پیش‌فرض) -->
        <div id="register-view" class="space-y-3.5 hidden">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">نام داروخانه / مرکز:</label>
                <input type="text" id="reg-pharmacy" placeholder="مثال: داروخانه دکتر مجیدی" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">نام مدیر کل:</label>
                <input type="text" id="reg-manager" placeholder="نام و نام خانوادگی مدیر" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">شماره موبایل مدیر:</label>
                <input type="text" id="reg-mobile" placeholder="09123456789" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">آیدی یکتا جهت ورود:</label>
                <input type="text" id="reg-username" placeholder="فقط حروف انگلیسی (مثال: farshad_j)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">رمز عبور مدیر:</label>
                <div class="relative">
                    <input type="password" id="reg-pass" placeholder="حداقل 8 کاراکتر" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none neon-input transition">
                    <button type="button" onclick="togglePassword('reg-pass', this)" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-400 text-base focus:outline-none transition">👁️</button>
                </div>
            </div>

            <button onclick="handleRegister()" class="w-full neon-reg-btn text-white font-medium py-3 rounded-xl transition mt-2">
                تایید و ایجاد انبار اختصاصی
            </button>
            
            <div class="text-center pt-2">
                <a href="#" onclick="switchView('login-view')" class="text-xs text-slate-400 hover:text-white transition">بازگشت به صفحه ورود</a>
            </div>
        </div>

        <!-- پنل اصلی مدیریت (Dashboard View - بعد از ورود موفق) -->
        <div id="dashboard-view" class="hidden space-y-4">
            <div class="bg-slate-900 p-4 rounded-2xl border border-sky-500/30 flex items-center justify-between shadow-md">
                <div>
                    <h2 id="lbl-pharmacy-name" class="text-sm font-bold text-white">داروخانه</h2>
                    <p id="lbl-manager-info" class="text-xs text-sky-400 mt-0.5">مدیر کل: -</p>
                </div>
                <button onclick="handleLogout()" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs transition">خروج</button>
            </div>

            <div class="bg-sky-500/10 border border-sky-500/30 p-4 rounded-2xl text-center space-y-3">
                <p class="text-xs text-sky-300">انبار اختصاصی شما آماده است و امنیت ایزوله برقرار شد.</p>
                <button onclick="alert('بخش اسکنر بارکد و مدیریت انبار در گام بعدی به این بخش اضافه خواهد شد.')" class="w-full neon-btn text-white text-xs font-medium py-3 rounded-xl transition">
                    📷 ورود به بخش اسکنر هوشمند و انبارداری
                </button>
            </div>
        </div>

    </div>

    <script>
        let registeredPharmacies = JSON.parse(localStorage.getItem('ph_db') || '[]');

        function switchView(viewId) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('register-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function togglePassword(fieldId, btn) {
            const passInput = document.getElementById(fieldId);
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                btn.innerText = '👁️';
            }
        }

        function handleRegister() {
            const pharmacy = document.getElementById('reg-pharmacy').value.trim();
            const manager = document.getElementById('reg-manager').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (!pharmacy || !manager || !mobile || !username || !pass) {
                alert('لطفا تمام فیلدهای ثبت‌نام را کامل پر کنید.');
                return;
            }

            const exists = registeredPharmacies.some(p => p.mobile === mobile || p.username === username);
            if (exists) {
                alert('خطا: این شماره موبایل یا آیدی کاربری قبلاً در سیستم ثبت شده است!');
                return;
            }

            registeredPharmacies.push({ pharmacy, manager, mobile, username, pass });
            localStorage.setItem('ph_db', JSON.stringify(registeredPharmacies));

            alert('انبار اختصاصی با موفقیت ساخته شد. حالا می‌توانید وارد شوید.');
            switchView('login-view');
        }

        function handleLogin() {
            const userInput = document.getElementById('login-user').value.trim();
            const passInput = document.getElementById('login-pass').value.trim();

            if (!userInput || !passInput) {
                alert('لطفا اطلاعات ورود را وارد کنید.');
                return;
            }

            const found = registeredPharmacies.find(p => (p.mobile === userInput || p.username === userInput) && p.pass === passInput);

            if (found) {
                document.getElementById('lbl-pharmacy-name').innerText = found.pharmacy;
                document.getElementById('lbl-manager-info').innerText = "مدیر کل: " + found.manager + " (" + found.mobile + ")";
                switchView('dashboard-view');
            } else {
                if ((userInput === 'farshad_admin' || userInput === '09123456789') && passInput === 'Farshad@8') {
                    document.getElementById('lbl-pharmacy-name').innerText = "داروخانه مرکزی (پیش‌فرض)";
                    document.getElementById('lbl-manager-info').innerText = "مدیر کل: فرشاد (09123456789)";
                    switchView('dashboard-view');
                    return;
                }
                alert('اطلاعات ورود اشتباه است یا کاربری با این مشخصات ثبت‌نام نکرده است.');
            }
        }

        function handleLogout() {
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
            switchView('login-view');
        }
    </script>
</body>
</html>
