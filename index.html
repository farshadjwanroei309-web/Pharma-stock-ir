<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت کالا و انبار</title>
    <!-- کتابخانه اسکنر بارکد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121824;
            color: #fff;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a2233;
            padding: 20px;
            border-radius: 10px;
        }
        .scanner-controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, .gallery-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-primary { background-color: #00bcd4; color: white; }
        .gallery-btn { background-color: #ff9800; color: white; display: inline-block; text-align: center; }
        .btn-danger { background-color: #f44336; color: white; }
        
        #interactive.viewport {
            width: 100%;
            height: 200px;
            background: #000;
            position: relative;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #interactive.viewport video, #interactive.viewport canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #b0bec5;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #121824;
            border: 1px solid #37474f;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        /* کادر کاملاً قرمز رنگ هشدار انقضا */
        #expiry-warning-box {
            border: 2px solid red !important;
            background-color: rgba(255, 0, 0, 0.12);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        #expiry-warning-box h3 {
            color: red;
            margin-top: 0;
            font-size: 15px;
        }
        #expiring-items-list {
            padding-right: 20px;
            margin: 0;
            color: #ff6666;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ثبت کالا و اسکنر هوشمند بارکد</h2>

    <!-- بخش کنترل‌های اسکنر (دوربین و دکمه جدید گالری) -->
    <div class="scanner-controls">
        <button id="start-camera" class="btn-primary" type="button">روشن کردن دوربین</button>
        
        <!-- دکمه انتخاب از گالری برای اسکن بارکد عکس -->
        <label for="gallery-barcode-input" class="gallery-btn">
            📁 انتخاب از گالری
        </label>
        <input type="file" id="gallery-barcode-input" accept="image/*" style="display: none;" />

        <button id="stop-camera" class="btn-danger" type="button">توقف</button>
    </div>

    <!-- کادر نمایش دوربین -->
    <div id="interactive" class="viewport"></div>

    <!-- فرم ثبت کالا -->
    <form id="product-form">
        <div class="form-group">
            <label>بارکد (GTIN / IRC):</label>
            <input type="text" id="barcode-input-field" placeholder="اسکن یا وارد کنید...">
        </div>

        <div class="form-group">
            <label>نام کالا / دارو:</label>
            <input type="text" id="product-name" placeholder="نام محصول">
        </div>

        <div class="form-group">
            <label>تاریخ انقضا:</label>
            <input type="text" id="expiry-date" placeholder="مثال: 1408/09/10">
        </div>

        <div class="form-group">
            <label>تعداد:</label>
            <input type="number" id="quantity" value="10">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; background: #00897b;">💾 ذخیره و ثبت نهایی</button>
    </form>

    <!-- کادر قرمز رنگ هشدار انقضا (زیر ۳۰ روز) -->
    <div id="expiry-warning-box">
        <h3>⚠️ هشدار انقضا (کالاهای کمتر از ۳۰ روز مانده)</h3>
        <ul id="expiring-items-list">
            <li>در حال بررسی اقلام...</li>
        </ul>
    </div>
</div>

<script>
    // راه‌اندازی دوربین
    document.getElementById('start-camera').addEventListener('click', function() {
        Quagga.init({
            inputStream : {
                name : "Live",
                type : "LiveStream",
                target: document.querySelector('#interactive')
            },
            decoder : {
                readers : ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"]
            }
        }, function(err) {
            if (err) {
                console.error(err);
                alert('خطا در دسترسی به دوربین');
                return;
            }
            Quagga.start();
        });
    });

    document.getElementById('stop-camera').addEventListener('click', function() {
        try { Quagga.stop(); } catch(e) {}
    });

    Quagga.onDetected(function(result) {
        var code = result.codeResult.code;
        document.getElementById('barcode-input-field').value = code;
        alert('بارکد با موفقیت اسکن شد: ' + code);
        try { Quagga.stop(); } catch(e) {}
    });

    // خواندن بارکد از تصویر انتخاب‌شده از گالری
    document.getElementById('gallery-barcode-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            Quagga.decodeSingle({
                decoder: {
                    readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader", "code_39_reader"]
                },
                locate: true,
                src: event.target.result
            }, function(result) {
                if (result && result.codeResult) {
                    document.getElementById('barcode-input-field').value = result.codeResult.code;
                    alert('بارکد از تصویر گالری خوانده شد: ' + result.codeResult.code);
                } else {
                    alert('بارکدی در تصویر یافت نشد. لطفاً عکس واضح‌تری انتخاب کنید.');
                }
            });
        };
        reader.readAsDataURL(file);
    });

    // ثبت کالا و ذخیره در حافظه محلی
    document.getElementById('product-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('product-name').value;
        const barcode = document.getElementById('barcode-input-field').value;
        const expiryDate = document.getElementById('expiry-date').value;
        const quantity = document.getElementById('quantity').value;

        if (!name || !expiryDate) {
            alert('لطفاً نام محصول و تاریخ انقضا را وارد کنید.');
            return;
        }

        const newProduct = { name, barcode, expiryDate, quantity };
        
        let products = JSON.parse(localStorage.getItem('warehouse_products') || '[]');
        products.push(newProduct);
        localStorage.setItem('warehouse_products', JSON.stringify(products));

        alert('کالا با موفقیت ثبت شد!');
        document.getElementById('product-form').reset();
        checkAndShowExpiringItems();
    });

    // نمایش خودکار اقلام دارای انقضا زیر ۳۰ روز در کادر قرمز رنگ
    function checkAndShowExpiringItems() {
        let products = JSON.parse(localStorage.getItem('warehouse_products') || '[]');
        const listElement = document.getElementById('expiring-items-list');
        listElement.innerHTML = '';

        const today = new Date();
        const thirtyDaysLater = new Date();
        thirtyDaysLater.setDate(today.getDate() + 30);

        let count = 0;

        products.forEach(product => {
            const expDate = new Date(product.expiryDate);
            if (!isNaN(expDate) && expDate <= thirtyDaysLater) {
                count++;
                const li = document.createElement('li');
                li.textContent = `محصول: ${product.name} | انقضا: ${product.expiryDate} (تعداد: ${product.quantity})`;
                listElement.appendChild(li);
            }
        });

        if (count === 0) {
            listElement.innerHTML = '<li>هیچ کالایی در آستانه انقضا (کمتر از ۳۰ روز) نیست.</li>';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        checkAndShowExpiringItems();
    });
</script>

</body>
</html>
